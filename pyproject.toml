[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-rs-multistakeholder"
version = "1.0.0"
description = "Multistakeholder Alignment in POI Recommendations"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Anonymous"}
]
keywords = ["recommendation systems", "POI", "re-ranking", "RecBole"]

dependencies = [
    # Core RecBole
    "recbole==1.2.0",

    # Hyperparameter optimization
    "hyperopt==0.2.7",
    "ray[tune]==2.44.1",

    # Scientific computing
    # NOTE: main study and votekit require numpy>=2; subdirectory recommendation
    #       generation has its own venv pinned to numpy==1.26.4
    "numpy==2.3.5",
    "pandas==2.2.2",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",

    # Deep learning
    "torch==2.3.1",

    # Visualization
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "plotly==6.0.1",

    # Statistics
    "statsmodels==0.14.4",
    "pingouin==0.5.5",

    # Data processing
    "PyYAML==6.0.2",
    "tqdm==4.67.1",

    # Utilities
    "colorlog==4.7.2",
    "tabulate==0.9.0",

    # Rank fusion (rrf_aggregation.py)
    "ranx==0.3.21",

    # NOTE: rbo==0.1.3 (used by evaluation_metrics.rank_biased_overlap) pins
    #       numpy<2.0 in its own metadata, which conflicts with numpy==2.3.5
    #       above -- pip cannot resolve both as normal dependencies. The
    #       package's code has no actual numpy-2 incompatibility (only uses
    #       np.isclose), so it's installed manually instead of listed here:
    #       pip install --no-deps rbo==0.1.3
]

[project.optional-dependencies]
# Full dependency set from pip list (main venv, numpy 2.3.5)
all = [
    "absl-py==2.4.0",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "apportionment==1.0",
    "attrs==23.2.0",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.7",
    "click==8.3.2",
    "cloudpickle==3.1.2",
    "colorama==0.4.4",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fastrlock==0.8.3",
    "filelock==3.25.2",
    "fonttools==4.62.1",
    "frozenlist==1.8.0",
    "fsspec==2026.3.0",
    "future==1.0.0",
    "grpcio==1.80.0",
    "idna==3.11",
    "Jinja2==3.1.6",
    "joblib==1.5.3",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kiwisolver==1.5.0",
    "llvmlite==0.45.1",
    "Markdown==3.10.2",
    "MarkupSafe==3.0.3",
    "mpmath==1.3.0",
    "msgpack==1.1.2",
    "narwhals==2.19.0",
    "networkx==3.6.1",
    "numba==0.62.1",
    # NOTE: main study uses numpy==2.3.5; subdirectory rec generation uses numpy==1.26.4
